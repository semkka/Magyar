<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f2f3f5">
<title>Magyar Szavak — мои венгерские слова</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e6e8eb;--soft:#f6f7f9;
--accent:#1f2328;--ok:#2f7d4f;--okbg:#e8f4ec;--bad:#cd2a3e;--badbg:#fdecee;--mid:#c98a12;--midbg:#fdf5e4;--star:#7c5cff;--starbg:#f0ecff;
--sh:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.flag{display:inline-flex;flex-direction:column;width:26px;height:18px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex-shrink:0}
.flag i{flex:1}
h1{font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.tr{display:flex;align-items:center;gap:6px}
.saved{font-size:11px;color:var(--ok);background:var(--okbg);border-radius:999px;padding:4px 8px;opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.show{opacity:1}
.dstreak{background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.goalmini{margin:10px 0 12px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.goalmini .bar{flex:1}
.bar{height:8px;border-radius:99px;background:#e4e6ea;overflow:hidden;display:flex}
.bar>div{height:100%;transition:width .4s}
.goalfill{background:var(--ok)}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bn .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nb{border:0;background:transparent;font-size:10.5px;color:#6b7280;padding:4px 0;border-radius:10px;line-height:1.25}
.nb b{display:block;font-size:19px;font-weight:400}
.nb.on{color:var(--text);font-weight:700;background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:#374151}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .cnt{opacity:.6;margin-left:3px;font-size:12px}
.modes .chip{font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{text-align:center;padding:8px 4px;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.stat b{display:block;font-size:19px;line-height:1.2}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card+.card,.mt{margin-top:12px}
.timer{height:6px;border-radius:99px;background:#e4e6ea;overflow:hidden;margin-bottom:10px}
.timer div{height:100%;width:100%;background:var(--accent);transition:width 1s linear}
.timer.low div{background:var(--bad)}
.q{text-align:center;padding:16px 4px 6px;position:relative}
.badge{position:absolute;top:0;right:0;font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 8px}
.sess{position:absolute;top:0;left:0;font-size:11px;color:var(--muted)}
.dir{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:8px}
.word{font-size:clamp(26px,8.5vw,38px);font-weight:800;letter-spacing:-.01em;margin:8px 0 2px;line-height:1.15;word-break:break-word}
.pron{color:var(--muted);font-size:15px;min-height:20px}
.speak{margin-top:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px}
.speak[hidden]{display:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{min-height:56px;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:10px;font-size:15.5px;font-weight:600;transition:transform .12s,background .2s,border-color .2s}
.opt:hover:not(:disabled){border-color:#c7cbd1;background:#fff}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.typebox{display:flex;gap:8px;margin-top:12px}
.inp{flex:1;min-width:0;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;font-size:16px;outline:none}
.inp:focus{border-color:#9aa1ab;background:#fff}
.btn{border:0;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.okb{background:var(--ok)}.btn.badb{background:var(--bad)}
.btn.w{width:100%}
.btn:disabled{opacity:.45}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.fb{margin-top:12px;text-align:center;font-size:15.5px;line-height:1.45}
.fb:empty{margin:0}
.good{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.delta{font-size:12px;color:var(--muted)}
.next{display:none;width:100%;margin-top:12px}
.center{text-align:center}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty .big{font-size:40px;margin-bottom:6px}
.rb{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;vertical-align:middle;white-space:nowrap}
.r0{background:var(--badbg);color:var(--bad)}.r1{background:var(--midbg);color:var(--mid)}.r2{background:var(--okbg);color:var(--ok)}.r3{background:var(--starbg);color:var(--star)}
.lvl{font-size:11px;border-radius:999px;padding:2px 7px;white-space:nowrap}
.fcwrap{perspective:1000px;margin:6px 0 14px}
.fc{position:relative;height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.fc .back{transform:rotateY(180deg);background:#fff}
.fc .tip{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
.fcmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.lh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 4px}
.lh:first-child{margin-top:0}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{font-size:15.5px}
.li .t small{display:block;color:var(--muted);font-size:13px}
.prx{color:var(--muted);font-size:13px;margin-left:4px;font-weight:400}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 9px;font-size:12.5px;white-space:nowrap}
.ib.add{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select.sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-size:14px;max-width:100%}
.form{display:grid;gap:8px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h3{font-size:16px;margin-bottom:10px}
h2{font-size:20px;letter-spacing:-.01em}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sbox{background:var(--soft);border-radius:14px;padding:12px}
.sbox b{display:block;font-size:22px}
.sbox span{font-size:12px;color:var(--muted)}
.lv4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.lv4 b{display:block;font-size:19px}.lv4 span{font-size:11px;color:var(--muted)}
.miss{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.miss:last-child{border:0}
.miss span{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
/* home */
.hello{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ring{width:84px;height:84px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qb{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:600;line-height:1.25}
.qb b{display:block;font-size:22px;margin-bottom:4px;font-weight:400}
.qb:hover{background:#fff}
.bigbtn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:16px;padding:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-align:left}
.bigbtn small{display:block;font-weight:400;opacity:.75;font-size:12px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.kv span{color:var(--muted)}
/* games */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{border:0;background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:16px 12px;text-align:left}
.gcard b{display:block;font-size:26px;margin-bottom:6px;font-weight:400}
.gcard strong{display:block;font-size:15px}
.gcard small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.35}
.back{border:0;background:transparent;color:var(--muted);font-size:14px;margin-bottom:8px;padding:4px 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:1px solid var(--line);border-bottom-width:3px;background:#fff;border-radius:12px;padding:9px 12px;font-size:16px;font-weight:600}
.tile.used{opacity:.25;box-shadow:none;pointer-events:none}
.answer{min-height:58px;border-bottom:2px dashed var(--line);margin:10px 0 14px;padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.answer.ok{border-color:var(--ok)}.answer.bad{border-color:var(--bad)}
.pairs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{min-height:64px;border:1px solid var(--line);background:var(--soft);border-radius:12px;font-size:14px;font-weight:600;padding:6px;word-break:break-word}
.pt.hu{background:#fff}
.pt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pt.done{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:.55}
.pt.err{background:var(--badbg);border-color:var(--bad);animation:shake .35s}
.mask{font-size:30px;font-weight:800;letter-spacing:.12em;margin:10px 0;word-break:break-word}
.kb{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:10px}
.key{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:9px 0;font-weight:700;font-size:15px}
.key.hit{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.key.miss{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.lives{font-size:18px;letter-spacing:2px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:34px;margin:12px auto 4px;display:block}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(205,42,62,.15)}}
details.sec{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;padding:15px 16px;font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;cursor:pointer}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary:after{content:"›";color:var(--muted);font-size:20px;line-height:1;transition:transform .2s}
details.sec[open] summary:after{transform:rotate(90deg)}
.sb{padding:0 16px 14px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.set label{flex:1}
.set small{display:block;color:var(--muted);font-size:12px}
.sw{appearance:none;width:44px;height:26px;border-radius:99px;background:#d6d9de;position:relative;cursor:pointer;transition:.2s;flex-shrink:0}
.sw:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw:checked{background:var(--ok)}.sw:checked:before{left:20px}
input[type=range]{width:140px;accent-color:var(--accent)}
.pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.5);font-size:24px;font-weight:800;z-index:60;opacity:0;pointer-events:none;white-space:nowrap;background:#fff;padding:12px 20px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.pop.show{animation:pop 1.4s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,30px);opacity:0;z-index:70;background:var(--accent);color:#fff;font-weight:600;padding:11px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:.3s;max-width:92vw;text-align:center;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(31,35,40,.35);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.overlay.show{display:flex}
.result{max-width:360px;width:100%;text-align:center}
.result .big{font-size:52px;font-weight:800;line-height:1;margin:8px 0}
.result p{color:var(--muted);margin-bottom:4px}
.result .btn{width:100%;margin-top:10px}
.streakfire{display:inline-block}.streakfire.hot{animation:flame .6s ease}
@keyframes flame{50%{transform:scale(1.35)}}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
/* настройки вида */
body.compact .card{padding:13px}body.compact .opt{min-height:44px;padding:7px}body.compact .q{padding:8px 4px 2px}
body.compact .word{font-size:clamp(22px,7vw,30px)}body.compact .li{padding:7px 0}body.compact .fc{height:180px}
body.nopron .pron,body.nopron .prx{display:none}
body.norating .rb{display:none}

/* ===================== v5 ===================== */
:root{--blue:#2f6fdf;--bluebg:#eaf1fd}
body.dark{--bg:#121417;--card:#1c1f24;--text:#e8eaed;--muted:#9aa3ae;--line:#2d3239;--soft:#23272d;--accent:#3a6fd8;--ok:#4caf74;--okbg:#17301f;--bad:#ef5a6c;--badbg:#3a1a1f;--mid:#e0a43a;--midbg:#3a2e14;--star:#9a82ff;--starbg:#2a2446;--blue:#6ea0ff;--bluebg:#1b2a44;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}
body.dark .opt:hover:not(:disabled),body.dark .inp:focus,body.dark .fc .back,body.dark .qb:hover,body.dark .tile,body.dark .pt.hu{background:var(--card)}
body.dark .overlay{background:rgba(0,0,0,.6)}
body.dark .pop{color:var(--text)}
body.dark input[type=date]{color-scheme:dark}
body.dark .sel,body.dark .inp,body.dark select{background:var(--soft);color:var(--text);border-color:var(--line)}
body.dark .bn{background:rgba(28,31,36,.96);border-color:var(--line)}
body.dark .flag{box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.col{display:flex;flex-direction:column}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea.inp{width:100%;resize:vertical;min-height:120px;line-height:1.5;font:inherit;padding:12px}
mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
body.dark mark{background:#6b5a12}
.pic{font-size:44px;line-height:1;text-align:center;margin:2px 0 6px}
.helpcard{border:1px solid var(--mid);background:var(--midbg);margin-top:10px}
.helpcard ol{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.5}
.helpcard p{font-size:14px;line-height:1.45}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chk input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--ok)}
.ul{padding-left:18px;font-size:14px;line-height:1.55;margin-top:6px}
.ul li{margin:3px 0}
.src a{color:var(--blue);word-break:break-word}
.ivhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ivhead .cd{background:var(--bluebg);color:var(--blue);border-radius:14px;padding:8px 12px;text-align:center;min-width:76px}
.ivhead .cd b{display:block;font-size:26px;line-height:1}
.ivhead .cd span{font-size:11px}
.ivq{margin-top:10px}
.ivq2{padding:10px 0;border-bottom:1px solid var(--line)}
.ivq2 small{display:block;color:var(--muted)}
.ivqt{font-size:19px;font-weight:700;line-height:1.35}
.ivans{background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.45}
.ivmodel{background:var(--okbg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.45}
.tform{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tform label{font-size:13px;color:var(--muted);font-weight:600}
.pf{display:grid;gap:8px}
.prx{color:var(--muted);font-size:13px;font-weight:400}
.consul{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.av{font-size:34px;line-height:1;flex-shrink:0}
.bub{background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:17px;line-height:1.4;max-width:100%}
.bub small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin:8px 0;padding:2px}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--accent);color:#fff;border-radius:16px 4px 16px 16px}
.msg.me .bub small{color:rgba(255,255,255,.8)}
.bub.them{background:var(--bluebg)}
.duel{display:flex;justify-content:space-between;gap:10px;align-items:center}
.gap{border:0;border-bottom:2px solid var(--blue);background:transparent;font:inherit;font-weight:700;text-align:center;padding:0 4px;color:var(--text);min-width:3ch}
.gap:focus{outline:none;background:var(--bluebg)}
.hintline{display:block;margin:6px 0;line-height:1.5;cursor:pointer}
.bigtext{font-size:19px;line-height:1.5;font-weight:600}
.opts.one{grid-template-columns:1fr}
.opt.al{text-align:left;line-height:1.35}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.yes{color:var(--ok);font-weight:700}
.errx{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.errx:last-child{border-bottom:0}
.rex{font-size:15px;line-height:1.6;margin-top:8px}

/* Hungarian app → progress sync (zero user setup).
 * Transport: ntfy.sh public topic (CORS *, no account). Grok Bot pulls the topic
 * from its box and copies rows into Google Sheet "Венгерский — прогресс"
 * (https://docs.google.com/spreadsheets/d/1D1kxEzoTUGvY3dPnjCnRJt7Qp3t1yfcm2pMp0b053oM/edit).
 * ntfy.sh keeps messages only 12 h, so EVERY message carries today's full
 * snapshot + last 7 days (hist) → later messages backfill anything missed.
 * Never put diary TEXT or personal data here: the topic is unauthenticated.
 */
const HU_SYNC = {
  enabled: true,
  endpoint: "https://ntfy.sh/hu-progress-630c0512e6b8dfd5245d8a33",
  tz: "Asia/Yekaterinburg",
  maxBytes: 3800, // ntfy turns bodies > 4096 B into attachments; stay below
  queueKey: "huSyncQueue",
};

function huSyncDate(d = new Date()) {
  // DD.MM.YYYY in Asia/Yekaterinburg
  const p = new Intl.DateTimeFormat("ru-RU", { timeZone: HU_SYNC.tz, day: "2-digit", month: "2-digit", year: "numeric" }).formatToParts(d);
  const g = t => p.find(x => x.type === t).value;
  return g("day") + "." + g("month") + "." + g("year");
}
function huSyncTs(d = new Date()) {
  // ISO-like local time with +05:00
  const p = new Intl.DateTimeFormat("sv-SE", { timeZone: HU_SYNC.tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(d);
  return p.replace(" ", "T") + "+05:00";
}
function huSyncId() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
}

/**
 * sendProgress(data)
 * data = {
 *   type: "session" | "day_end" | "open",
 *   ver: "v5",
 *   day: { min, rev, new, acc, streak, known, diary, games, intMin, intQ, xp, lvl },
 *        // min = minutes in app today (timer), rev = words reviewed today,
 *        // new = new words learned today, acc = accuracy % today (0-100),
 *        // streak = days, known = total known words, diary = 1/0,
 *        // games = games played today, intMin/intQ = interview practice
 *        // minutes / questions today, xp = total XP, lvl = level
 *   hist: [ ["DD.MM.YYYY", min, rev, new, acc, diary, games, intMin, intQ, xp], ... ] // last 7 days incl. today

 * Fire-and-forget; failed sends are queued in localStorage and retried.

function sendProgress(data) {
  if (!HU_SYNC.enabled) return Promise.resolve(false);
  const msg = {
    v: 1, type: data.type || "session", id: huSyncId(), ts: huSyncTs(), date: huSyncDate(),
    ver: data.ver || "", day: data.day || {}, hist: (data.hist || []).slice(-7), det: data.det || {}

  let body = JSON.stringify(msg);
  if (new Blob([body]).size > HU_SYNC.maxBytes) { msg.det = { truncated: true }; body = JSON.stringify(msg); }

function huSyncPost(body) {
  // text/plain + no custom headers = CORS "simple request" (works from file://, https, in-app viewers)
  return fetch(HU_SYNC.endpoint, { method: "POST", body, headers: { "Content-Type": "text/plain;charset=UTF-8" }, keepalive: body.length < 60000 })

  let q; try { q = JSON.parse(localStorage.getItem(HU_SYNC.queueKey) || "[]"); } catch (e) { q = []; }

  localStorage.setItem(HU_SYNC.queueKey, "[]");

function fromV3(o){ // перенос прогресса из версии 3 (и 2)
  const S=fresh();S.migratedFrom=o.v||2;
  const isBase=hu=>MAIN_WORDS.some(w=>w[0]===hu);
  for(const hu in (o.prog||{})){const p=o.prog[hu];const l=Math.max(0,Math.min(2,p.lvl|0));
    S.words[hu]={r:LVR[l]+Math.min(10,(p.run||0)*4),ok:p.ok||0,bad:p.bad||0,run:p.run||0,last:(p.ok||p.bad)?Date.now():null,intro:isBase(hu)||!!(p.ok||p.bad)}}
  for(const hu in (o.moved||{})){S.moved[hu]=1;if(!S.words[hu])S.words[hu]={r:LVR[o.moved[hu]|0],ok:0,bad:0,run:0,last:null,intro:false}}
  S.custom=(o.custom||[]).map(c=>({hu:c.hu,ru:c.ru,pr:c.pr||"",list:c.list||"new"}));
  S.custom.forEach(c=>{if(!S.words[c.hu])S.words[c.hu]={r:10,ok:0,bad:0,run:0,last:null,intro:false}});
  if(Array.isArray(o.mistakes))S.mistakes=o.mistakes.map(m=>({hu:m.hu,t:m.t||Date.now(),fix:m.fix||0}));
  if(o.stats)S.stats={total:o.stats.total||0,correct:o.stats.correct||0,games:{}};
  if(o.daily)Object.assign(S.daily,{goal:o.daily.goal||20,date:o.daily.date||today(),count:o.daily.count||0,streak:o.daily.streak||0,last:o.daily.last||null,bestStreak:o.daily.bestStreak||0});
  if(o.best)for(const k in o.best)S.best["old_"+k]=o.best[k];
  return S;
}

let ALL=[],MAIN=[],NEW=[],HU=new Map();
function rebuild(){
  const m=MAIN_WORDS.map(([hu,ru,pr,l])=>({hu,ru,pr,base:l,src:"base"}));
  const n=NEW_WORDS.map(([th,hu,ru,pr])=>({hu,ru,pr,base:0,src:"new",theme:th}));
  // своё слово, совпавшее со встроенным, превращается в перенос встроенного слова
  const builtin=new Set(MAIN_WORDS.map(w=>w[0]).concat(NEW_WORDS.map(w=>w[1])));
  if(S.custom.some(x=>builtin.has(x.hu))){S.custom=S.custom.filter(x=>{if(!builtin.has(x.hu))return true;if(x.list==="main"&&NEW_WORDS.some(w=>w[1]===x.hu))S.moved[x.hu]=1;return false})}
  const c=S.custom.map(x=>({hu:x.hu,ru:x.ru,pr:x.pr||"",base:0,src:"custom",theme:"mine",list:x.list}));
  MAIN=m.concat(n.filter(w=>S.moved[w.hu]),c.filter(w=>w.list==="main"));
  NEW=n.filter(w=>!S.moved[w.hu]).concat(c.filter(w=>w.list!=="main"));
  ALL=MAIN.concat(NEW);HU=new Map();ALL.forEach((w,i)=>{w.i=i;HU.set(w.hu,w)});
}
rebuild();

function ws(w){return S.words[w.hu]||(S.words[w.hu]={r:w.src==="base"?LVR[w.base]:10,ok:0,bad:0,run:0,last:null,intro:w.src==="base"})}
function eff(w){const s=S.words[w.hu];const r=s?s.r:(w.src==="base"?LVR[w.base]:10);
  if(!s||!s.last)return Math.round(r);const days=(Date.now()-s.last)/DAY;if(days<1)return Math.round(r);
  return Math.max(0,Math.round(r-Math.min(20,days*(r>=70?1:2))))}
const lvlOf=w=>lvlFromR(eff(w));
const isIntro=w=>w.src==="base"||!!(S.words[w.hu]&&S.words[w.hu].intro);
function isDue(w){if(!isIntro(w))return false;const s=S.words[w.hu],l=lvlOf(w);if(l===0)return true;
  if(!s||!s.last)return l<2;return (Date.now()-s.last)/DAY>=[0,1,3,7][l]}
const rBadge=w=>{const e=eff(w);return `<span class="rb r${lvlFromR(e)}" title="Рейтинг слова">★ ${e}</span>`};

const keyRu=s=>s.toLowerCase().replace(/[?!.,«»()]/g,"").replace(/\s+/g," ").trim();
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prTxt=w=>w.pr?`<span class="prx">[${esc(w.pr)}]</span>`:"";
const rnd=a=>a[Math.random()*a.length|0];
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>{a=norm(a);b=norm(b);if(!a&&!b)return 1;return 1-lev(a,b)/Math.max(a.length,b.length)};
function daysWord(n,suffix=true){const a=n%10,b=n%100;const w=(a===1&&b!==11)?"день":(a>=2&&a<=4&&(b<10||b>=20))?"дня":"дней";return suffix?w+" подряд":w}

function rollDay(){const d=S.daily;if(d.date!==today()){d.date=today();d.count=0;d.newToday=0;d.extraNew=0}}
const dayStreak=()=>{const d=S.daily;return(d.last===today()||d.last===dayShift(today(),-1))?d.streak:0};
const newLeft=()=>{rollDay();return Math.max(0,S.settings.newPerDay+S.daily.extraNew-S.daily.newToday)};
function checkGoal(){const d=S.daily;rollDay();
  if(d.count>=d.goal&&d.last!==today()){d.streak=(d.last===dayShift(today(),-1))?d.streak+1:1;d.last=today();d.bestStreak=Math.max(d.bestStreak||0,d.streak);
    addXP(50);confetti(220);popup(`🎯 Цель дня! 🔥 ${d.streak} ${daysWord(d.streak)}`)}}
function introduce(w){const s=ws(w);if(!s.intro){s.intro=true;rollDay();S.daily.newToday++;dlog().newW++;toast(`✨ Новое слово: «${w.hu}»`);save()}}
// ok — верно ли; o: {fast, typed, spoken, weight, game, quiet}
function answer(w,ok,o={}){
  const s=ws(w),e0=eff(w),l0=lvlFromR(e0),k=o.weight||1;
  let r;
  if(ok){const mult=1+(o.fast?.25:0)+(o.typed?.3:0)+(o.spoken?.3:0);r=Math.min(100,e0+Math.max(3,(100-e0)*.2)*mult*k);s.ok++;s.run++}
  else{r=Math.max(0,e0-(10+e0*.25)*k);s.bad++;s.run=0}
  s.r=Math.round(r*10)/10;s.last=Date.now();s.intro=true;
  if(!o.quiet){
    const mi=S.mistakes.findIndex(x=>x.hu===w.hu);
    if(ok){if(mi>=0){S.mistakes[mi].fix=(S.mistakes[mi].fix||0)+1;if(S.mistakes[mi].fix>=2)S.mistakes.splice(mi,1)}}
    else{if(mi>=0)S.mistakes.splice(mi,1);S.mistakes.unshift({hu:w.hu,t:Date.now(),fix:0});S.mistakes=S.mistakes.slice(0,40)}
    S.stats.total++;if(ok)S.stats.correct++;const g=o.game||"other";S.stats.games[g]=(S.stats.games[g]||0)+1;
    rollDay();S.daily.count++;checkGoal();
    const l1=lvlFromR(s.r);
    if(l1>l0)toast(l1>=2?`Слово выучено! 🎉 «${w.hu}» → ${LV[l1].ic} ${LV[l1].name}`:`«${w.hu}» → ${LV[l1].ic} ${LV[l1].name} 💪`);
  }
  logAnswer(w,ok,o,e0,s.r,l0);
  save();renderTop();
  const e1=Math.round(s.r);return{from:e0,to:e1,d:e1-e0};
}

function weight(w){const p=S.settings.priority/50;return Math.pow(101-eff(w),p)+2}
function weighted(arr){const ws_=arr.map(weight);const tot=ws_.reduce((s,x)=>s+x,0);let r=Math.random()*tot;for(let i=0;i<arr.length;i++){r-=ws_[i];if(r<0)return arr[i]}return arr[arr.length-1]}
let lastHu=null;
function pickWord(pool,{avoid=[]}={}){
  let cand=pool.filter(w=>w.hu!==lastHu&&!avoid.includes(w.hu));if(!cand.length)cand=pool.filter(w=>!avoid.includes(w.hu));if(!cand.length)return null;
  const intro=cand.filter(isIntro),fr=cand.filter(w=>!isIntro(w));
  const useNew=fr.length&&newLeft()>0&&(intro.length<4||Math.random()<.22);
  let w=null;
  if(useNew)w=rnd(fr);else if(intro.length)w=weighted(intro);
  if(!w)return null;
  lastHu=w.hu;return w;
}
function pickMany(pool,n){const out=[],used=new Set(),ru=new Set();let guard=0;
  while(out.length<n&&guard++<300){const w=pickWord(pool,{avoid:[...used]});if(!w)break;used.add(w.hu);if(ru.has(keyRu(w.ru)))continue;ru.add(keyRu(w.ru));out.push(w);if(!isIntro(w))introduce(w)}
  return out}
function distractors(cur,pool,n){const used=new Set([keyRu(cur.ru)]),out=[];
  for(const o of shuffle(pool.filter(w=>w!==cur)).concat(shuffle(ALL.slice()))){if(out.length>=n)break;if(used.has(keyRu(o.ru))||out.includes(o))continue;out.push(o);used.add(keyRu(o.ru))}
  return out}

      :`<div class="hint">${SR?"Распознавание речи выключено в настройках.":"Этот браузер не умеет распознавать речь."} Скажи слово вслух и проверь себя.</div><button class="btn ghost w mt" id="showAns">👀 Показать ответ</button>`}

  $("sYes").onclick=()=>fin(true);$("sNo").onclick=()=>fin(false);

function scoreSpeech(alts,target){let best=0,heard=alts[0]||"";
  for(const a of alts){const s=Math.max(sim(a,target),norm(a).split(" ").some(t=>sim(t,target)>=.85)?.9:0,norm(a).includes(norm(target))?1:0);if(s>best){best=s;heard=a}}
  return{best,heard,ok:best>=.75}}
function listen(w){
  if(rec){try{rec.abort()}catch(e){}rec=null}
  try{rec=new SR()}catch(e){return selfCheck()}
  rec.lang="hu-HU";rec.interimResults=false;rec.maxAlternatives=5;
  if(!micContextOk()){$("micHint").innerHTML=micHelpCard("context");return selfCheck()}
  const mic=$("mic");mic.classList.add("on");$("micHint").textContent="Слушаю… 👂";
  let got=false;
  rec.onresult=ev=>{got=true;const alts=[...ev.results[0]].map(a=>a.transcript);const r=scoreSpeech(alts,w.hu);finishSpeak(r.ok,r.heard,r.best)};
  rec.onerror=ev=>{mic.classList.remove("on");const m={"not-allowed":"нет доступа к микрофону","network":"нет интернета","no-speech":"ничего не слышно","audio-capture":"микрофон не найден"}[ev.error]||ev.error;
    if(!$("micHint"))return;$("micHint").textContent=`Не получилось: ${m}. Попробуй ещё раз или проверь себя сам(а).`;
    if(/not-allowed|service-not-allowed|audio-capture/.test(ev.error))$("micHint").insertAdjacentHTML("afterend",micHelpCard(ev.error));
    if(!$("showAns2")){$("micHint").insertAdjacentHTML("afterend",`<button class="btn ghost w mt" id="showAns2">👀 Показать ответ</button>`);$("showAns2").onclick=()=>{$("showAns2").remove();selfCheck()}}};
  rec.onend=()=>{mic&&mic.classList.remove("on");rec=null;if(!got&&$("micHint")&&$("micHint").textContent.startsWith("Слушаю"))$("micHint").textContent="Ничего не услышал. Нажми 🎤 ещё раз."};
  try{rec.start()}catch(e){selfCheck()}
}

function moveToMain(hus,lvl){let n=0;

    const s=ws(w);s.r=Math.max(eff(w),LVR[lvl]);n++}
  save();rebuild();toast(n===1?`«${hus[0]}» → «Мои слова». В играх появится постепенно ⏳`:`Добавлено слов: ${n}. Они будут появляться постепенно ⏳`);renderWords()}

function addCustom(hu,ru,pr,list){hu=hu.trim();ru=ru.trim();pr=pr.trim().replace(/^\[|\]$/g,"");if(!hu||!ru)return;
  if(ALL.some(w=>norm(w.hu)===norm(hu))){toast(`«${hu}» уже есть в словах`);return}
  S.custom.push({hu,ru,pr,list});S.words[hu]={r:10,ok:0,bad:0,run:0,last:null,intro:false};save();rebuild();toast(`Добавлено: «${hu}»`);renderWords()}

const gamePool=()=>MAIN;

// ---- 🧩 Собери фразу
const SENT=SENTENCES.map(([hu,ru,keys,alt],i)=>({id:i,hu,ru,keys:keys?keys.split(","):[],alt:alt?alt.split("||"):[]}));
const tokHu=s=>s.replace(/[.,!?]/g,"").split(/\s+/).filter(Boolean).map(t=>/^Tyumen/.test(t)?t:t.toLowerCase());
const tokRu=s=>s.replace(/[.,!?—]/g," ").split(/\s+/).filter(Boolean).map(t=>t.toLowerCase());
function sentKnown(s){const ks=s.keys.map(byHu).filter(Boolean);if(!ks.length)return{share:1,avg:60};
  const inM=ks.filter(w=>inMain(w)&&isIntro(w));return{share:inM.length/ks.length,avg:inM.length?inM.reduce((a,w)=>a+eff(w),0)/inM.length:0}}
function sentPool(){return SENT.filter(s=>sentKnown(s).share>=.6)}
function sentR(s){const st=S.sent[s.id];return st?st.r:Math.round(sentKnown(s).avg*.8)}
let SB=null;
function sentStart(){
  const p=sentPool();const locked=SENT.length-p.length;
  if(!p.length){$("game").innerHTML=`<div class="empty"><div class="big">🔒</div>Фразы откроются, когда ты выучишь больше слов.</div>`;return}
  const pw=Math.max(.3,S.settings.priority/50);const cand=p.length>1&&SB?p.filter(x=>x.id!==SB.s.id):p;
  const wts=cand.map(x=>Math.pow(101-sentR(x),pw)+2);let r=Math.random()*wts.reduce((a,b)=>a+b,0),s=cand[cand.length-1];
  for(let i=0;i<cand.length;i++){r-=wts[i];if(r<0){s=cand[i];break}}
  const mode=S.settings.direction==="hu"?"ru":S.settings.direction==="ru"?"hu":(Math.random()<.65?"hu":"ru"); // hu = собрать венгерскую фразу
  const target=mode==="hu"?tokHu(s.hu):tokRu(s.ru);
  const others=shuffle(SENT.filter(x=>x!==s)).flatMap(x=>mode==="hu"?tokHu(x.hu):tokRu(x.ru)).filter(t=>!target.map(x=>x.toLowerCase()).includes(t.toLowerCase()));
  const dis=[...new Set(others)].slice(0,1+(Math.random()*3|0));
  SB={s,mode,target,tiles:shuffle(target.concat(dis).map((t,i)=>({t,i}))),picked:[],done:false};
  $("game").innerHTML=`<div class="q" style="padding-top:6px"><span class="badge"><span class="rb r${lvlFromR(sentR(s))}">★ ${Math.round(sentR(s))}</span></span>
     <div class="dir">${mode==="hu"?"Собери по-венгерски":"Собери по-русски"}</div><div class="word" style="font-size:22px">${esc(mode==="hu"?s.ru:s.hu)}</div>${mode==="ru"?speakBtn(s.hu):""}</div>
    <div class="answer" id="ans"></div><div class="tiles" id="pool"></div>
    <div class="fb" id="fb"></div>
    <div class="row2b" id="sbBtns"><button class="btn ghost" id="sbClear">Очистить</button><button class="btn" id="sbCheck">Проверить</button></div>
    <button class="btn next" id="nextBtn">Дальше →</button>
    <div class="note center">Открыто фраз: ${p.length} из ${SENT.length}${locked?` · 🔒 ещё ${locked} откроются, когда добавишь и выучишь новые слова`:""}</div>`;
  if(mode==="ru")autoSay(s.hu);
  drawTiles();$("sbClear").onclick=()=>{SB.picked=[];drawTiles()};$("sbCheck").onclick=sentCheck;$("nextBtn").onclick=sentStart;
}
function drawTiles(){
  $("ans").innerHTML=SB.picked.map((i,k)=>`<button class="tile" data-k="${k}">${esc(SB.tiles.find(x=>x.i===i).t)}</button>`).join("");
  $("pool").innerHTML=SB.tiles.map(x=>`<button class="tile${SB.picked.includes(x.i)?" used":""}" data-t="${x.i}">${esc(x.t)}</button>`).join("");
  if(SB.done)return;
  document.querySelectorAll("#pool [data-t]").forEach(b=>b.onclick=()=>{const i=+b.dataset.t;if(!SB.picked.includes(i)){SB.picked.push(i);drawTiles()}});
  document.querySelectorAll("#ans [data-k]").forEach(b=>b.onclick=()=>{SB.picked.splice(+b.dataset.k,1);drawTiles()});
}
function sentCheck(){
  if(!SB.picked.length||SB.done)return;SB.done=true;
  const built=SB.picked.map(i=>SB.tiles.find(x=>x.i===i).t).join(" ").toLowerCase();
  const s=SB.s;const cands=SB.mode==="hu"?[s.hu].concat(s.alt).map(x=>tokHu(x).join(" ").toLowerCase()):[tokRu(s.ru).join(" ")];
  const ok=cands.includes(built);
  const st=S.sent[s.id]||(S.sent[s.id]={r:sentR(s),ok:0,bad:0,last:null});const e0=Math.round(st.r);
  st.r=ok?Math.min(100,st.r+Math.max(4,(100-st.r)*.25)):Math.max(0,st.r-(8+st.r*.2));ok?st.ok++:st.bad++;st.last=Date.now();
  // ключевые слова фразы тоже немного меняют рейтинг
  s.keys.map(byHu).filter(w=>w&&inMain(w)&&isIntro(w)).forEach(w=>answer(w,ok,{weight:ok?.35:.25,quiet:true}));
  S.stats.total++;if(ok)S.stats.correct++;S.stats.games.sent=(S.stats.games.sent||0)+1;rollDay();S.daily.count++;checkGoal();
  if(ok)S.best.g_sent=(S.best.g_sent||0)+1;save();renderTop();
  $("ans").classList.add(ok?"ok":"bad");
  $("fb").innerHTML=(ok?`<span class="good">Tökéletes! Верно 🎉</span>`:`<span class="no">Почти! Правильно так:</span>`)+
    `<br><b>${esc(s.hu)}</b><br><span style="color:var(--muted)">${esc(s.ru)}</span>${s.alt.length&&SB.mode==="hu"?`<div class="note">Тоже верно: ${s.alt.map(esc).join(" · ")}</div>`:""}<br>${speakBtn(s.hu)}
    <div class="delta">Рейтинг фразы: ${e0} → <b>${Math.round(st.r)}</b></div>`;
  autoSay(s.hu);drawTiles();$("sbBtns").style.display="none";$("nextBtn").style.display="block";
  if(ok)confetti(60);
}

  const tiles=shuffle(words.flatMap(w=>[{w,side:"hu"},{w,side:"ru"}]));

  $("game").innerHTML=`<div class="fcmeta"><span>Пар: <b id="pDone">0</b>/${words.length} · ошибок: <b id="pErr">0</b></span><span>⏱ <b id="pTime">0</b> с</span></div><div class="pairs" id="pairs"></div><div class="hint">Нажми венгерское слово, потом его перевод</div>`;
  $("pairs").innerHTML=tiles.map((x,k)=>`<button class="pt ${x.side}" data-p="${k}">${esc(x.side==="hu"?x.w.hu:x.w.ru)}</button>`).join("");

function pairClick(k,b){
  if(PG.lock||b.classList.contains("done"))return;const x=PG.tiles[k];
  if(PG.sel===null){PG.sel=k;b.classList.add("sel");if(x.side==="hu")say(x.w.hu);return}
  const a=PG.tiles[PG.sel],ab=document.querySelector(`[data-p="${PG.sel}"]`);
  if(PG.sel===k){b.classList.remove("sel");PG.sel=null;return}
  if(a.side===x.side){ab.classList.remove("sel");PG.sel=k;b.classList.add("sel");if(x.side==="hu")say(x.w.hu);return}
  if(a.w===x.w){
    ab.classList.remove("sel");ab.classList.add("done");b.classList.add("done");PG.sel=null;PG.done++;$("pDone").textContent=PG.done;
    if(!PG.bad.has(x.w.hu))answer(x.w,true,{weight:.7,game:"pairs"});
    if(PG.done===PG.words.length)pairsEnd();
  }else{
    PG.err++;$("pErr").textContent=PG.err;PG.lock=true;ab.classList.add("err");b.classList.add("err");
    [a.w,x.w].forEach(w=>{if(!PG.bad.has(w.hu)){PG.bad.add(w.hu);answer(w,false,{weight:.5,game:"pairs"})}});
    setTimeout(()=>{ab.classList.remove("err","sel");b.classList.remove("err");PG.sel=null;PG.lock=false},650);
  }
}
function pairsEnd(){stopAll();const t=Math.max(1,Math.round((Date.now()-PG.t0)/1000));const prev=S.best.g_pairs;const isRec=PG.err===0&&(!prev||t<prev);if(isRec){S.best.g_pairs=t;save()}
  showResult("🧠","Все пары найдены!",t+" с",`ошибок: ${PG.err}`,PG.err?"В рекорд идёт время без ошибок":"Чистая победа! 👏",isRec?"🏆 Новый рекорд!":prev?`Рекорд: ${prev} с`:"",()=>pairsStart())}

let HG=null;
const baseL=c=>c.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const KEYS="abcdefghijklmnoprstuvyz".split("");
function hangStart(){
  const cand=gamePool().filter(w=>/^[a-záéíóöőúüű ]{3,14}$/i.test(w.hu.replace(/[?!.]/g,"")));
  const w=pickWord(cand);if(!w){$("game").innerHTML=`<div class="empty">Нет подходящих слов</div>`;return}introduce(w);
  HG={w,word:w.hu.replace(/[?!.]/g,"").toLowerCase(),guessed:new Set(),miss:0,max:6,done:false};
  $("game").innerHTML=`<div class="q" style="padding-top:6px"><span class="badge">${rBadge(w)}</span><div class="dir">Угадай слово по-венгерски</div><div class="word" style="font-size:24px">${esc(w.ru)}</div>
    <div class="mask" id="mask"></div><div class="lives" id="lives"></div></div><div class="kb" id="kb"></div><div class="hint">Буквы с ударением открываются вместе с обычными: «a» откроет и «á»</div>
    <div class="fb" id="fb"></div><button class="btn next" id="nextBtn">Дальше →</button>`;
  $("nextBtn").onclick=hangStart;
  $("kb").innerHTML=KEYS.map(k=>`<button class="key" data-k="${k}">${k}</button>`).join("");
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>hangGuess(b.dataset.k,b));hangDraw();
}
function hangDraw(){$("mask").textContent=[...HG.word].map(c=>c===" "?"\u00a0\u00a0":HG.guessed.has(baseL(c))?c:"_").join(" ");
  $("lives").textContent="❤️".repeat(HG.max-HG.miss)+"🤍".repeat(HG.miss)}
function hangGuess(k,b){if(HG.done||HG.guessed.has(k))return;HG.guessed.add(k);
  const hit=[...HG.word].some(c=>baseL(c)===k);b.classList.add(hit?"hit":"miss");if(!hit)HG.miss++;hangDraw();
  const won=[...HG.word].every(c=>c===" "||HG.guessed.has(baseL(c)));
  if(won||HG.miss>=HG.max){HG.done=true;const x=answer(HG.w,won,{typed:won&&HG.miss<=2,game:"hang"});
    if(won){S.best.g_hang=(S.best.g_hang||0)+1;save(true)}
    $("mask").textContent=HG.w.hu;$("fb").innerHTML=(won?`<span class="good">Kitaláltad! Угадал(а)! 🎉</span>`:`<span class="no">Не угадал(а) 😅</span>`)+`<br><b>${esc(HG.w.hu)}</b> ${prTxt(HG.w)} — ${esc(HG.w.ru)}<br>${speakBtn(HG.w.hu)}`+deltaTxt(x);
    autoSay(HG.w.hu);$("nextBtn").style.display="block";if(won)confetti(50)}}

// ===================== СТАТИСТИКА =====================
function renderStats(){
  const st=S.stats,acc=st.total?Math.round(st.correct/st.total*100):0,c=levelCounts(MAIN),t=MAIN.length||1;
  const seen=ALL.filter(w=>S.words[w.hu]&&(S.words[w.hu].ok+S.words[w.hu].bad)>0);
  const missed=seen.filter(w=>S.words[w.hu].bad>0).sort((a,b)=>S.words[b.hu].bad-S.words[a.hu].bad||eff(a)-eff(b)).slice(0,8);
  const weakest=MAIN.filter(isIntro).sort((a,b)=>eff(a)-eff(b)).slice(0,8);

function prTxtLvl(p){return p<=10?"Все слова почти одинаково часто":p<=40?"Слабые слова немного чаще":p<=60?"Слабые слова заметно чаще (обычно)":p<=80?"Сильно чаще слабые":"Почти только слабые слова"}
function exportJSON(){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`magyar-progress-${today()}.json`;document.body.appendChild(a);a.click();a.remove();toast("Файл с прогрессом скачан")}

    save();rebuild();applyLook();toast("Прогресс загружен ✓");render()}catch(err){toast("⚠️ Это не файл прогресса")}};r.readAsText(f);e.target.value=""};

// ===================== ЭФФЕКТЫ =====================
const cv=$("confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function confetti(n=120){cv.width=innerWidth;cv.height=innerHeight;const cols=["#cd2a3e","#ffffff","#2f7d4f","#f2b632","#7c5cff"];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*innerWidth*.4,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,s:Math.random()*7+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3,life:120+Math.random()*60});
  if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life-->0&&p.y<cv.height+20);
  for(const p of parts){p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.strokeStyle="rgba(0,0,0,.15)";cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null)}
let popT=null;function popup(t){const p=$("pop");p.textContent=t;p.classList.add("show");clearTimeout(popT);popT=setTimeout(()=>p.classList.remove("show"),2200)}
let toastT=null;function toast(t){const e=$("toast");if(!e)return;e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),2400)}

function dlog(d){d=d||today();S.days=S.days||{};return S.days[d]||(S.days[d]={a:0,c:0,ms:0,newW:0,lv2:0,g:{},iv:0,ivOk:0,mock:0,diary:false,xp:0,wd:{}})}
function logAnswer(w,ok,o,e0,r1,l0){
  const d=dlog();d.wd[w.hu]=Math.round(((d.wd[w.hu]||0)+(r1-e0))*10)/10;
  if(lvlFromR(r1)>=2&&l0<2)d.lv2++;
  if(!o.quiet){d.a++;if(ok)d.c++;const g=o.game||"other";d.g[g]=(d.g[g]||0)+1;addXP(ok?10:2);markActive();haptic(ok)}
  scheduleSync();checkAch();
}
// ⏱ Таймер занятий: идёт, пока приложение открыто и видно; пауза, когда вкладка скрыта/закрыта.
// Если 5 минут не было ни одного касания — тоже пауза (чтобы забытая вкладка не «накручивала» время).
let lastAct=Date.now(),tickT=Date.now();["pointerdown","keydown","touchstart"].forEach(e=>addEventListener(e,()=>{lastAct=Date.now()},{passive:true}));
function timeTick(){const now=Date.now(),dt=Math.min(now-tickT,5e3);tickT=now;
  if(document.visibilityState==="visible"&&now-lastAct<300e3&&dt>0){dlog().ms+=dt;S.totalMs=(S.totalMs||0)+dt;const el=$("timeToday");if(el)el.textContent=fmtMin(dlog().ms)}}
setInterval(timeTick,1e3);setInterval(()=>save(true),30e3);
document.addEventListener("visibilitychange",()=>{timeTick();tickT=Date.now();if(document.visibilityState==="visible")lastAct=Date.now()});
addEventListener("pagehide",()=>{timeTick();save(true)});
const fmtMin=ms=>{const m=Math.round(ms/60e3);return m<60?m+" мин":Math.floor(m/60)+" ч "+(m%60)+" мин"};
function haptic(ok){try{if(S.settings.haptics&&navigator.vibrate)navigator.vibrate(ok?18:[30,40,30])}catch(e){}}
// ---- XP и уровни
const xpLevel=xp=>Math.floor((Math.sqrt(1+8*xp/100)-1)/2)+1;
const xpFor=l=>100*(l-1)*l/2;
function addXP(n){const l0=xpLevel(S.xp||0);S.xp=(S.xp||0)+n;dlog().xp+=n;const l1=xpLevel(S.xp);if(l1>l0){setTimeout(()=>{confetti(160);popup(`⬆️ Уровень ${l1}!`)},300)}}
// ---- Серия дней (как в Duolingo): день засчитывается, если сделан хотя бы один ответ. Одна «заморозка» в неделю.
const weekKey=d=>{const x=new Date(d+"T12:00:00");const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toLocaleDateString("sv")};
function refreshFreeze(){const L=S.login,wk=weekKey(today());if(L.freezeWeek!==wk){L.freezeWeek=wk;L.freezes=1}}
function markActive(){const L=S.login,t=today();if(L.last===t)return;refreshFreeze();
  const y=dayShift(t,-1),y2=dayShift(t,-2);
  if(L.last===y)L.streak++;
  else if(L.last===y2&&L.freezes>0){L.freezes--;L.used=(L.used||[]).concat([y]).slice(-60);L.streak++;toast("🧊 Заморозка спасла твою серию!")}
  else L.streak=1;
  L.last=t;L.best=Math.max(L.best||0,L.streak);
  if([3,7,14,30,50,100,200,365].includes(L.streak))setTimeout(()=>{confetti(200);popup(`🔥 ${L.streak} ${daysWord(L.streak)}!`)},400)}
function loginStreak(){const L=S.login,t=today();if(L.last===t||L.last===dayShift(t,-1))return L.streak;
  if(L.last===dayShift(t,-2)&&(L.freezeWeek!==weekKey(t)||L.freezes>0))return L.streak;return 0}

function yearSuffix(y){y=+y;if(!y)return"";const l=y%10,t=y%100;let back;
  if(l)back=[3,6,8].includes(l);else if(t)back=[20,30,60,80].includes(t);else if(y%1000)back=true;else back=false;return y+"-"+(back?"ban":"ben")}

// похожесть фраз: доля слов эталона, найденных в ответе (без ударений)
function phraseScore(said,target){const A=norm(said).split(" ").filter(Boolean),B=norm(target).split(" ").filter(Boolean);if(!B.length)return 0;
  let hit=0;const used=new Set();for(const b of B){let bi=-1,bs=0;A.forEach((a,i)=>{if(used.has(i))return;const s=1-lev(a,b)/Math.max(a.length,b.length);if(s>bs){bs=s;bi=i}});if(bs>=.75){hit++;used.add(bi)}}
  return hit/B.length}

function trHu(s){const V={a:"о",á:"аа",e:"е",é:"ээ",i:"и",í:"ии",o:"о",ó:"оо",ö:"ё",ő:"ёё",u:"у",ú:"уу",ü:"ю",ű:"юю"};
  const C=[["dzs","дж"],["ssz","сс"],["ccs","чч"],["ggy","ддь"],["nny","ннь"],["tty","тть"],["lly","йй"],["zzs","жж"],["cs","ч"],["dz","дз"],["gy","дь"],["ly","й"],["ny","нь"],["sz","с"],["ty","ть"],["zs","ж"],
   ["b","б"],["c","ц"],["d","д"],["f","ф"],["g","г"],["h","х"],["j","й"],["k","к"],["l","л"],["m","м"],["n","н"],["p","п"],["r","р"],["s","ш"],["t","т"],["v","в"],["z","з"],["w","в"],["x","кс"],["y","и"],["q","к"]];
  s=s.toLowerCase();let o="",i=0,prev=" ";
  while(i<s.length){const ch=s[i];if(V[ch]){o+=(!/[a-záéíóöőúüű]/.test(prev)&&(ch==="e"||ch==="é"))?(ch==="e"?"э":"ээ"):V[ch];prev=ch;i++;continue}

  duelT(duelRound,who==="me"?1100:1600)}
function duelEnd(){duelClear();const me=DU.me,bot=DU.bot,win=me>bot,draw=me===bot,st=DU.st;
  const acc=st.myAns?Math.round(st.myOk/st.myAns*100):0,avg=st.rt.length?(st.rt.reduce((a,b)=>a+b,0)/st.rt.length/1000).toFixed(1):"—",bavg=st.botT.length?(st.botT.reduce((a,b)=>a+b,0)/st.botT.length/1000).toFixed(1):"—";
  const sk0=duelSkill();if(DU.lv==="auto"){const diff=Math.max(-4,Math.min(4,me-bot));S.duelSkill=clamp01(sk0+(win?.08:draw?0:-.08)+diff*.015)}
  S.duels=(S.duels||[]).concat([{date:today(),me,bot,lv:DU.lv,win,draw,acc,r:DU.r}]).slice(-100);
  if(win){addXP(40+Math.max(0,me-bot)*5);confetti(220)}else addXP(10);
  const d=dlog();d.g.duelm=(d.g.duelm||0)+1;checkAch();save();scheduleSync();renderTop();
  const W=duelWeek();
  $("game").innerHTML=`<div class="dzend ${win?"win":draw?"draw":"lose"}"><div class="dzbig">${win?"🏆":draw?"🤝":"🤖"}</div><h2>${win?"Победа!":draw?"Ничья!":"Grok Bot победил"}</h2>
    <div class="dzfinal"><span class="dzav me">${duelMeAv()}</span><b>${me}</b><span>:</span><b>${bot}</b><span class="dzav bot">🤖</span></div>
    <p class="note">${win?(me-bot>=4?"Разгром! Бот в шоке 😅":"Отличная скорость!"):draw?"Почти! Ещё раунд?":(bot-me<=2?"Совсем чуть-чуть не хватило — реванш?":"Бот был быстрее. Реванш? 💪")}${DU.lv==="auto"?` <br>Авто: бот стал ${S.duelSkill>sk0?"сильнее":S.duelSkill<sk0?"слабее":"таким же"}.`:""}</p></div>
   <div class="sgrid mt"><div class="sbox"><b>🎯 ${acc}%</b><span>твоя точность</span></div><div class="sbox"><b>⚡ ${avg} с</b><span>твоя скорость (верные)</span></div>
    <div class="sbox"><b>🔥 ${DU.best}</b><span>лучшее комбо</span></div><div class="sbox"><b>🤖 ${bavg} с</b><span>скорость бота · ${st.botAns?Math.round(st.botOk/st.botAns*100):0}% верно</span></div>
    <div class="sbox"><b>${st.wonR} / ${st.lostR}</b><span>раундов выиграно / проиграно</span></div><div class="sbox"><b>${W.w}–${W.l}</b><span>неделя: победы–поражения</span></div></div>
   <div class="row2b mt"><button class="btn" id="dzAgain">⚔️ Реванш</button><button class="btn ghost" id="dzMenu">Уровень и история</button></div>`;
  const lv=DU.lv;$("dzAgain").onclick=()=>duelNew(lv);$("dzMenu").onclick=()=>duelStart()}

// ===================== ЗАПУСК =====================
(function init(){
  // чистим подробный журнал слов у старых дней (экономим место), сами итоги дней остаются
  try{const lim=dayShift(today(),-45);for(const k in S.days)if(k<lim&&S.days[k].wd){S.days[k].rev=Object.keys(S.days[k].wd).length;S.days[k].wd={}}}catch(e){}
  S.role=S.role||{};S.pod=S.pod||{};S.rules=S.rules||{bm:[],done:{}};S.diary=S.diary||{};
  initDecks();refreshFreeze();applyLook();render();try{checkAch()}catch(e){}
  lastDayKey=today();
  if(!S.onboarded)setTimeout(()=>startTour(),350);
  setTimeout(()=>{try{doSync("open")}catch(e){}},1500);
  try{huSyncFlush()}catch(e){}
  // PWA — только когда приложение открыто по https (на file:// это не работает)
  if(location.protocol==="https:"){
    const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);
    const a=document.createElement("link");a.rel="apple-touch-icon";a.href="icon-192.png";document.head.appendChild(a);
    if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();

</script>
