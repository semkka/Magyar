// ---------- универсальный блок «произнеси»: попытки, повтор, «напишу вместо», «я сказал правильно» ----------
// mount(el,{target, ru, onDone(ok,{heard,sc,mode}), tries=3})
function sayBlock(el,o){const st={tries:0,done:false};const max=o.tries||3;const T_=o.target;
  el.innerHTML=`<div class="sayb"><button class="mic big" type="button" data-sb="mic" aria-label="Сказать вслух">${icon("mic",34)}</button>
    <div class="sbh" data-sb="hint" aria-live="polite">${canRecog()&&micContextOk()?"Нажми и скажи вслух":"Микрофон здесь недоступен — скажи вслух и проверь себя"}</div><div class="sbr" data-sb="res"></div>
    <div class="sbtns"><button class="btn ghost sm" type="button" data-sb="listen">${icon("volume",15)} Образец</button><button class="btn ghost sm" type="button" data-sb="type">⌨️ Напишу вместо</button><button class="btn ghost sm" type="button" data-sb="self">👀 Проверю себя сам</button></div>
    <div data-sb="extra"></div></div>`;
  const q=k=>el.querySelector(`[data-sb="${k}"]`);const mic=q("mic"),hint=q("hint"),res=q("res"),extra=q("extra");
  if(!(canRecog()&&micContextOk()))mic.disabled=true;
  const finish=(ok,info)=>{if(st.done)return;st.done=true;el.querySelectorAll("button,input").forEach(b=>b.disabled=true);o.onDone(ok,info)};
  q("listen").onclick=()=>say(T_,.7);
  q("type").onclick=()=>{extra.innerHTML=`<form class="typebox" data-sb="tf" autocomplete="off"><input class="inp" placeholder="Напиши по-венгерски…" spellcheck="false" autocapitalize="off" aria-label="Ответ"><button class="btn" type="submit">OK</button></form>`;
    const f=extra.querySelector("form"),inp=f.querySelector("input");inp.focus();f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;const ok=norm(v)===norm(T_)||sim(v,T_)>=.9;finish(ok,{heard:v,sc:ok?1:sim(v,T_),mode:"typed"})}};
  q("self").onclick=()=>{extra.innerHTML=`<div class="note">Правильно: <b>${esc(T_)}</b> ${o.pr?`<span class="prx">[${esc(o.pr)}]</span>`:""}</div><div class="row2b mt"><button class="btn badb" type="button" data-sb="sn">Ошибся</button><button class="btn okb" type="button" data-sb="sy">Сказал правильно</button></div>`;
    say(T_);q("sn").onclick=()=>finish(false,{mode:"self"});q("sy").onclick=()=>finish(true,{mode:"self",reduced:canRecog()&&micContextOk()})};
  mic.onclick=()=>{if(MIC.r){micStop();return}mic.classList.add("on");hint.textContent="Слушаю… 👂";res.innerHTML="";
    recCore({hints:[T_].concat(o.hints||[]),onInterim:t=>{hint.textContent="… "+t}}).then(alts=>{mic.classList.remove("on");st.tries++;const m=speechMatch(alts,T_);
      if(m.ok){hint.textContent="";const tp=m.exact?[]:pronTips(m.heard,T_);if(tp.length)res.innerHTML=tp.map(t=>`<div class="ptip">💡 ${t}</div>`).join("");finish(true,{heard:m.heard,sc:m.sc,mode:"voice"});return}
      const tips=pronTips(m.heard,T_);res.innerHTML=`<div class="heard">Услышал: «<b>${esc(m.heard)}</b>» · ${Math.round(m.sc*100)}%</div><div class="dif">Нужно: ${diffHTML(m.heard,T_)}</div>${tips.map(t=>`<div class="ptip">💡 ${t}</div>`).join("")}`;
      if(st.tries>=max){hint.textContent="";finish(false,{heard:m.heard,sc:m.sc,mode:"voice"});return}
      hint.innerHTML=(m.close?"Почти! ":"")+`Попробуй ещё раз (${st.tries}/${max}). Если распознаватель ошибся — <button class="lnk" type="button" data-sb="ovr">я сказал правильно</button>`;
      q("ovr").onclick=()=>finish(true,{heard:m.heard,sc:m.sc,mode:"override",reduced:true})},
     err=>{mic.classList.remove("on");if(err==="aborted"){hint.textContent="Нажми и скажи вслух";return}hint.innerHTML=micErrHTML(err)+(micErrHard(err)?"":" <b>Нажми 🎤, чтобы повторить.</b>");if(micErrHard(err)){mic.disabled=true;q("self").click()}})}}
// ---------- советы по произношению: что именно не совпало (это советы, а не правила экзамена) ----------
const PRON_TIPS=[
 [/sz/,/s(?!z)/,"«sz» читается как русское «с», а «s» — как «ш». Распознаватель услышал другой звук."],
 [/s(?!z)/,/sz/,"Одиночная «s» — это «ш» (sok = шок). Похоже, прозвучало «с»."],
 [/gy/,/(d|g)(?!y)/,"«gy» — мягкое «дь», как в слове «дьявол», одним звуком."],
 [/ny/,/n(?!y)/,"«ny» — мягкое «нь», как в «конь»."],
 [/ty/,/t(?!y)/,"«ty» — мягкое «ть», как в «тётя» (начало)."],
 [/cs/,/(c|ts|tch)(?!s)/,"«cs» — это «ч»."],
 [/zs/,/z(?!s)/,"«zs» — это «ж»."],
 [/[öő]/,/[oóeé]/,"«ö/ő» — округли губы как для «о» и скажи «э»: получится «ё» без «й»."],
 [/[üű]/,/[uúií]/,"«ü/ű» — губы как для «у», язык как для «и»: звук «ю» без «й»."]];
function pronTips(heard,target){const h=String(heard||"").toLowerCase(),t=String(target||"").toLowerCase();if(!h||!t)return [];const out=[];
  for(const [inT,inH,tip] of PRON_TIPS){if(inT.test(t)&&!inT.test(h)&&inH.test(h))out.push(tip)}
  // долгие гласные и двойные согласные распознаватель часто «съедает» — подсказываем мягко
  const lv=(t.match(/[áéíóőúű]/g)||[]).length;if(lv&&norm(h)===norm(t)&&h!==t)out.push("Слово узнано! Долгие гласные (á, é, ő…) тяни чуть дольше — это меняет смысл (kar «рука» ≠ kár «жаль»).");
  if(/([bcdfghjklmnprstvz])\1/.test(t)&&!/([bcdfghjklmnprstvz])\1/.test(h)&&norm(h).length<norm(t).length)out.push("Двойную согласную держи чуть дольше: «kettő» — «кэт-тёё».");
  if(!out.length&&t.split(" ").length>1&&h.split(" ").length<t.split(" ").length)out.push("Похоже, часть фразы потерялась. Скажи её целиком, без паузы в середине.");
  if(!out.length&&sim(h,t)<.5)out.push("Совет: сначала нажми «Образец», повтори за ним по слогам, ударение — на первый слог.");
  return out.slice(0,2)}

// ===================== 🎤 v6.1: ИГРА «ПРОИЗНЕСИ» (внутри «Игр») =====================
// Раньше кнопка в «Играх» ничего не открывала (игры "speak" не было в списке запуска).
// Теперь это отдельная игра: 8 раундов — слова (сначала слабые) и короткие фразы, распознавание с попытками,
// «Образец» перед ответом, запасные пути «Напишу вместо» / «Проверю себя сам», итог с разбором.
const SG={items:[],i:0,res:[],kind:"mix"};
function speakItems(kind){const words=MAIN.filter(isIntro);const base=(words.length>=6?words:MAIN).slice();
  base.sort((a,b)=>eff(a)-eff(b)+(Math.random()-.5)*30);const W=base.slice(0,12).map(w=>({t:"w",hu:w.hu,ru:w.ru,pr:w.pr,w}));
  const sp=(sentPool().length?sentPool():SENT).filter(s=>s.hu.split(" ").length<=4);const P=shuffle(sp.slice()).slice(0,6).map(s=>({t:"s",hu:s.hu,ru:s.ru,s,pr:hu2ru(s.hu)}));
  const out=kind==="words"?W.slice(0,8):kind==="phrases"&&P.length>=4?P.slice(0,8):shuffle(W.slice(0,5).concat(P.slice(0,3)));return out.slice(0,8)}
function speakStart(){gameStarted("speakg");
  const mic=canRecog()&&micContextOk();
  $("game").innerHTML=`<div class="q"><div class="dir">🎤 Произнеси</div><div class="note">Скажи вслух слово или короткую фразу. Сначала можно послушать образец 🔊.
    ${mic?"Распознаватель проверит произношение; если он ошибся — нажми «я сказал правильно» (это засчитывается с половиной баллов).":`<br><b>Микрофон здесь недоступен</b> — ${esc(micWhyNot())}. Можно говорить вслух и оценивать себя.`}</div></div>
    <div class="seg mt" id="sgKind">${[["mix","Всё вперемешку"],["words","Слова"],["phrases","Фразы"]].map(([k,n])=>`<button class="${SG.kind===k?"on":""}" data-sk="${k}">${n}</button>`).join("")}</div>
    <button class="btn mt" id="sgGo" style="width:100%">Начать · 8 раундов</button>`;
  document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{SG.kind=b.dataset.sk;document.querySelectorAll("[data-sk]").forEach(x=>x.classList.toggle("on",x===b))});
  $("sgGo").onclick=()=>{SG.items=speakItems(SG.kind);SG.i=0;SG.res=[];if(!SG.items.length){$("game").innerHTML=`<div class="empty"><div class="big">🤷</div>Пока нечего произносить — сначала познакомься с несколькими словами.</div>`;return}speakRound()}}
function micWhyNot(){if(!SR)return "этот браузер не умеет распознавать речь (нужен Chrome или Safari)";if(!S.settings.recog)return "распознавание выключено в настройках";if(!micContextOk())return "нужна страница по https:// в обычном браузере (не во встроенном)";return "неизвестная причина"}
function speakRound(){const it=SG.items[SG.i];if(!it)return speakEnd();answered=false;
  $("game").innerHTML=`<div class="q"><div class="fcmeta"><span>Раунд ${SG.i+1}/${SG.items.length}</span><span>${it.t==="w"?"слово":"фраза"}</span></div>
    <div class="word"${it.t==="s"?' style="font-size:24px"':""}>${esc(it.hu)}</div><div class="pron">${it.t==="w"?prTxt(it.w):`<span class="prx">[${esc(it.pr)}]</span>`}</div><div class="note">${esc(it.ru)}</div></div>
    <div id="sayBox"></div><div class="fb" id="fb"></div><button class="btn next" id="nextBtn">${SG.i+1<SG.items.length?"Дальше →":"Итог →"}</button>`;
  $("nextBtn").onclick=()=>{SG.i++;speakRound()};
  sayBlock($("sayBox"),{target:it.hu,pr:it.pr,hints:it.t==="s"?it.hu.split(" "):[],onDone:(ok,info)=>{if(answered)return;answered=true;let x=null;
    if(it.t==="w")x=answer(it.w,ok,{spoken:info.mode==="voice"&&ok,typed:info.mode==="typed",weight:info.reduced?.5:1,game:"speakg",input:info.heard||"",dir:"hu",voice:info.mode==="voice"});
    else{const s=it.s;S.sent[s.id]=S.sent[s.id]||{r:sentR(s),ok:0,bad:0,last:null};const st=S.sent[s.id];rateStep(st,ok,{spoken:info.mode==="voice",weight:info.reduced?.5:1,quality:info.sc});
      ok?st.ok=(st.ok||0)+1:st.bad=(st.bad||0)+1;st.last=Date.now();try{srsGrade("s|"+s.id,ok,{})}catch(e){}
      rollDay();S.daily.count++;dlog().a++;if(ok)dlog().c++;S.stats.total++;if(ok)S.stats.correct++;S.stats.games.speakg=(S.stats.games.speakg||0)+1;checkGoal();save();renderTop()}
    if(ok)addXP(info.reduced?3:8);sfx(ok?"ok":"bad");
    SG.res.push({hu:it.hu,ok,mode:info.mode,sc:info.sc,heard:info.heard,reduced:!!info.reduced});
    $("fb").innerHTML=(ok?(info.reduced?`<span class="good">Засчитано</span> <small>· половина баллов</small>`:`<span class="good">Szuper! 🎉</span>`):`<span class="no">Пока не получилось — послушай образец и попробуй в следующий раз</span>`)+(x?deltaTxt(x):"");
    $("nextBtn").style.display="block";$("nextBtn").focus({preventScroll:true})}});
  setTimeout(()=>{if(canSpeak&&!answered)say(it.hu)},350)}
function speakEnd(){const n=SG.res.length,good=SG.res.filter(r=>r.ok).length,clean=SG.res.filter(r=>r.ok&&!r.reduced).length;
  if(good>(S.best.g_speakg||0)&&n>=8){S.best.g_speakg=good;save()}

  $("game").innerHTML=`<div class="center"><div class="big">${good>=7?"🏆":good>=5?"👏":"💪"}</div><h2>${good}/${n}</h2><div class="note">чисто распознано: ${clean} · с самопроверкой/поправкой: ${good-clean}</div></div>
    <div class="list mt">${SG.res.map(r=>`<div class="li"><div class="t"><b>${esc(r.hu)}</b><small>${r.ok?(r.reduced?"✓ засчитано (поправка)":"✓ отлично"):"✗ "+(r.heard?"услышал: «"+esc(r.heard)+"»":"не получилось")}</small></div>${r.sc!=null&&r.mode==="voice"?`<span class="rb">${Math.round(r.sc*100)}%</span>`:""}<button class="ib" data-say="${esc(r.hu)}" ${canSpeak?"":"hidden"} aria-label="Послушать">🔊</button></div>`).join("")}</div>
    ${bad.length?`<div class="note mt">Трудные слова стоит отправить в «📌 Закрепление».</div><button class="btn ghost mt" id="sgFix" style="width:100%">📌 Трудные — в закрепление (${bad.length})</button>`:""}

// 1) Слова, открытые из «Игр»/«Главной» (например «Скоростной перевод»), получают кнопку «← Назад» туда, откуда пришли.

const NAVH={ret:null,armed:false,busy:false};

go=function(t,opt={}){const prev=tab;

  else if(!WORD_TABS.includes(t)||!opt.mode)NAVH.ret=null;

function visibleEl(sel){return [...document.querySelectorAll(sel)].find(el=>{if(el.disabled)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=="hidden"})}
function appBack(){

function navArm(){if(NAVH.busy||history.state&&history.state.mg==="app")return;try{if(!history.state||history.state.mg!=="root")history.replaceState({mg:"root"},"");history.pushState({mg:"app"},"");NAVH.armed=true}catch(e){}}
